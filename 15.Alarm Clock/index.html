<!DOCTYPE html>
<!-- Coding By CodingNepal - youtube.com/codingnepal -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Alarm Clock in JavaScript | CodingNepal</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <!-- Background Color Selector -->
    <div class="bg-color-selector">
      <label for="bgColorSelect">Background Color:</label>
      <select id="bgColorSelect">
        <option value="pastel-yellow">Pastel Yellow</option>
        <option value="pastel-blue">Pastel Blue</option>
        <option value="pastel-pink">Pastel Pink</option>
        <option value="pastel-green">Pastel Green</option>
        <option value="pastel-purple">Pastel Purple</option>
        <option value="pastel-peach">Pastel Peach</option>
      </select>
    </div>

    <div class="wrapper">
      <img src="./files/clock.svg" alt="clock">
      <h1>00:00:00 PM</h1>
      <div class="content">
        <div class="column">
          <select>
            <option value="Hour" selected disabled hidden>Hour</option>
          </select>
        </div>
        <div class="column">
          <select>
            <option value="Minute" selected disabled hidden>Minute</option>
          </select>
        </div>
        <div class="column">
          <select>
            <option value="AM/PM" selected disabled hidden>AM/PM</option>
          </select>
        </div>
      </div>
      <button>Set Alarm</button>
      
      <div class="alarm-list-section">
        <h2>Alarm List <span class="alarm-count">(0/10)</span></h2>
        <ul class="alarm-list" id="alarmList">
          <!-- Alarms will be added here dynamically -->
        </ul>
      </div>
    </div>

    <!-- Edit Alarm Modal -->
    <div id="editModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Edit Alarm</h2>
          <button class="close-modal" onclick="closeEditModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="editHour">Hour:</label>
            <select id="editHour">
              <option value="Hour" selected disabled hidden>Hour</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editMinute">Minute:</label>
            <select id="editMinute">
              <option value="Minute" selected disabled hidden>Minute</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editAMPM">AM/PM:</label>
            <select id="editAMPM">
              <option value="AM/PM" selected disabled hidden>AM/PM</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
          <button class="btn-save" onclick="saveEditedAlarm()">Save Changes</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
